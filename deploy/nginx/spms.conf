# SPMS Production Nginx Server Configuration
# Link to: /etc/nginx/sites-available/spms.conf -> /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with actual domain or public IP

    # Redirect HTTP to HTTPS in production once SSL is configured
    # return 301 https://$host$request_uri;

    root /var/www/spms/frontend/dist;
    index index.html;

    client_max_body_size 30M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # 1. API routes -> PHP-FPM front-controller (/public/index.php)
    location ^~ /api {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/spms/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/spms/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param APP_ENV production;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # 2. Static Assets Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 3. Frontend SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 4. Strict Denial of Sensitive Paths
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~ ^/(storage/(private|backups|logs)|database|tests|docs|scripts)/ {
        deny all;
        return 404;
    }

    location ~ \.(env|json|lock|md|xml|yml|yaml|ini)$ {
        deny all;
        return 404;
    }
}
